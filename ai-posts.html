<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Posts com IA - SeriesNoMundo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; background-color: #1a1a1b; color: #e0e0e0; padding: 20px; max-width: 980px; margin: 0 auto; }
        h1, h2 { color: #ffffff; border-bottom: 1px solid #3a3a3c; padding-bottom: 10px; margin-bottom: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .auth-status, .hint { color: #adb5bd; font-size: 0.95em; }
        .form-container { background-color: #2c2c2e; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #3a3a3c; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #3a3a3c; background-color: #1a1a1b; color: #e0e0e0; font-size: 1em; }
        textarea { min-height: 220px; resize: vertical; }
        .output-box { min-height: 360px; font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; line-height: 1.5; }
        .form-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
        button, .back-link { padding: 10px 15px; font-size: 1.05em; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
        .form-submit-btn { background-color: #2f9e44; color: white; }
        .form-cancel-btn, .back-link { background-color: #6c757d; color: white; }
        .copy-btn { background-color: #007bff; color: white; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .status { min-height: 24px; font-weight: bold; }
        .status.error { color: #ff8787; }
        .status.success { color: #69db7c; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <section id="login-panel" class="form-container hidden">
        <h1>Gerar Posts com IA</h1>
        <p class="hint">Entre no painel para usar esta ferramenta.</p>
        <form id="login-form">
            <label for="login-email">E-mail:</label>
            <input type="email" id="login-email" autocomplete="username" required>
            <label for="login-password">Senha:</label>
            <input type="password" id="login-password" autocomplete="current-password" required>
            <p id="login-message" class="status error"></p>
            <div class="form-actions">
                <a href="admin.html" class="back-link">Voltar</a>
                <button type="submit" class="form-submit-btn">Entrar</button>
            </div>
        </form>
    </section>

    <section id="ai-content" class="hidden">
        <div class="top-bar">
            <div>
                <h1>Gerar Posts com IA</h1>
                <p class="auth-status" id="auth-status"></p>
            </div>
            <a href="admin.html" class="back-link">Voltar ao Admin</a>
        </div>

        <section class="form-container">
            <h2>Briefings</h2>
            <label for="post-count">Quantidade de posts:</label>
            <select id="post-count">
                <option value="1">1 post</option>
                <option value="2">2 posts</option>
                <option value="3">3 posts</option>
                <option value="4">4 posts</option>
                <option value="5">5 posts</option>
                <option value="6">6 posts</option>
                <option value="7">7 posts</option>
                <option value="8">8 posts</option>
                <option value="9">9 posts</option>
                <option value="10">10 posts</option>
            </select>

            <label for="briefings-input">Cole as ideias, resumos ou bases dos posts:</label>
            <textarea id="briefings-input" placeholder="Post 1:
Tema: 10 filmes de romance para assistir no fim de semana
Categoria: Filmes
Ideia: lista leve, com tom divertido, focada em streaming

---

Post 2:
Tema: séries curtas para maratonar em um dia
Categoria: Series
Ideia: indicar séries rápidas, com texto bem humano e SEO forte"></textarea>
            <p class="hint">Dica: separe cada ideia com uma linha contendo --- para a IA entender melhor cada post.</p>

            <div class="form-actions">
                <button type="button" class="form-cancel-btn" id="clear-btn">Limpar</button>
                <button type="button" class="form-submit-btn" id="generate-btn">Gerar posts</button>
            </div>
            <p id="status-message" class="status"></p>
        </section>

        <section class="form-container">
            <h2>Resultado</h2>
            <label for="generated-output">Texto gerado para copiar e colar no importador:</label>
            <textarea id="generated-output" class="output-box" readonly placeholder="Os posts gerados vao aparecer aqui."></textarea>
            <div class="form-actions">
                <button type="button" class="copy-btn" id="copy-btn">Copiar resultado</button>
            </div>
        </section>
    </section>

    <script src="ai-posts.js"></script>
</body>
</html>
