<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Fila de Quizzes - SeriesNoMundo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background-color: #1a1a1b; color: #e0e0e0; padding: 20px; max-width: 1120px; margin: 0 auto; }
        h1, h2 { color: #ffffff; border-bottom: 1px solid #3a3a3c; padding-bottom: 10px; margin-bottom: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .form-container { background-color: #2c2c2e; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #3a3a3c; }
        .hint, .auth-status, .queue-meta { color: #adb5bd; font-size: 0.95em; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #3a3a3c; background-color: #1a1a1b; color: #e0e0e0; font-size: 1em; }
        textarea { min-height: 260px; resize: vertical; }
        .draft-output { min-height: 240px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; line-height: 1.5; }
        .form-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
        button, .back-link { padding: 10px 15px; font-size: 1.02em; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
        .form-submit-btn { background-color: #2f9e44; color: white; }
        .form-cancel-btn, .back-link { background-color: #6c757d; color: white; }
        .copy-btn { background-color: #007bff; color: white; }
        .danger-btn { background-color: #c92a2a; color: white; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .status { min-height: 24px; font-weight: bold; }
        .status.error { color: #ff8787; }
        .status.success { color: #69db7c; }
        .queue-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 15px; }
        .summary-card { background: #1f1f20; border: 1px solid #3a3a3c; border-radius: 6px; padding: 12px; }
        .summary-card strong { display: block; color: #fff; font-size: 1.5em; }
        .queue-list { display: grid; gap: 14px; margin-top: 18px; }
        .queue-item { background: #1f1f20; border: 1px solid #3a3a3c; border-radius: 8px; padding: 14px; }
        .queue-item.is-done { border-color: #2f9e44; }
        .queue-item.is-error { border-color: #c92a2a; }
        .queue-header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
        .queue-title { font-weight: 800; color: #fff; }
        .queue-badge { border-radius: 999px; padding: 4px 10px; font-size: 0.82em; font-weight: 800; color: white; background: #6c757d; white-space: nowrap; }
        .queue-badge.done { background: #2f9e44; }
        .queue-badge.error { background: #c92a2a; }
        .queue-preview { color: #ced4da; margin: 8px 0 12px; white-space: pre-wrap; }
        .item-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
        .hidden { display: none; }
        @media (max-width: 720px) {
            body { padding: 14px; }
            .top-bar, .queue-header { flex-direction: column; align-items: stretch; }
            .queue-summary { grid-template-columns: 1fr; }
            .form-actions, .item-actions { justify-content: stretch; }
            button, .back-link { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <section id="login-panel" class="form-container hidden">
        <h1>Fila de Quizzes</h1>
        <p class="hint">Entre no painel para usar esta ferramenta.</p>
        <form id="login-form">
            <label for="login-email">E-mail:</label>
            <input type="email" id="login-email" autocomplete="username" required>
            <label for="login-password">Senha:</label>
            <input type="password" id="login-password" autocomplete="current-password" required>
            <p id="login-message" class="status error"></p>
            <div class="form-actions">
                <a href="admin.html" class="back-link">Voltar</a>
                <button type="submit" class="form-submit-btn">Entrar</button>
            </div>
        </form>
    </section>

    <section id="tool-content" class="hidden">
        <div class="top-bar">
            <div>
                <h1>Fila de Quizzes</h1>
                <p class="auth-status" id="auth-status"></p>
            </div>
            <a href="admin.html" class="back-link">Voltar ao Admin</a>
        </div>

        <section class="form-container">
            <h2>Quizzes crus</h2>
            <label for="raw-input">Cole ate 50 quizzes crus. Pode separar com --- ou repetir Titulo:</label>
            <textarea id="raw-input" placeholder="Titulo: Verdadeiro ou Falso - Modern Family
Descricao: Teste rapido sobre Modern Family
Tipo: verdadeiro_falso

Phil trabalha como corretor de imoveis.
Verdadeiro

Manny e filho biologico de Jay.
Falso
Manny e filho de Gloria com Javier.

Titulo: Quem Sou Eu - The Office
Tipo: quem_sou_eu
Descricao: Descubra o personagem.

Sou gerente regional da Dunder Mifflin.
A) Michael Scott
B) Jim Halpert
C) Dwight Schrute
D) Stanley Hudson
Resposta: A"></textarea>
            <p class="hint">O formatador nao publica nada. Ele so transforma o texto cru no formato aceito pelo importador de quizzes.</p>
            <div class="form-actions">
                <button type="button" class="form-submit-btn" id="format-btn">Formatar fila</button>
                <button type="button" class="copy-btn" id="copy-all-btn" disabled>Copiar tudo formatado</button>
                <button type="button" class="danger-btn" id="clear-btn">Limpar tudo</button>
            </div>
            <p id="status-message" class="status"></p>
        </section>

        <section class="form-container">
            <h2>Resultado</h2>
            <div class="queue-summary">
                <div class="summary-card"><span>Formatados</span><strong id="done-count">0</strong></div>
                <div class="summary-card"><span>Com ajuste</span><strong id="error-count">0</strong></div>
                <div class="summary-card"><span>Total</span><strong id="total-count">0</strong></div>
            </div>
            <div id="queue-list" class="queue-list"></div>
        </section>
    </section>

    <script src="quiz-formatter.js"></script>
</body>
</html>
